spring:
  datasource:
    url: jdbc:mysql://localhost:3307/inscription_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

# Feign timeouts (ms)
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

storage:
  base-path: C:/PRJ/Doctoral-project/doctoral-uploads

app:
  notifications:
    topic: inscription-events
