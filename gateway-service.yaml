spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: inscription
          uri: lb://inscription-service
          predicates:
            - Path=/inscription/**
          filters:
            - StripPrefix=1
        - id: users
          uri: lb://utilisateurs-service
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
