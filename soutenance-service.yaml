spring:
  datasource:
    url: jdbc:mysql://localhost:3307/soutenance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect


  spring:
    graphql:
      graphiql:
        enabled: true
      websocket:
        path: /graphql

    servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 40MB

  storage:
    base-path: C:/PRJ/Doctoral-project/doctoral-uploads

  app:
    notifications:
      topic: inscription-events

  soutenance:
    prereq:
      min-publications: 2
      min-communications: 2
      min-heures-formation: 200
      max-duree-annees: 6
